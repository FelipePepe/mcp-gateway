services:
  mcp-gateway:
    build:
      context: ..
      dockerfile: mcp-gateway/Dockerfile
    image: mcp-gateway:latest
    container_name: mcp-gateway
    restart: always
    ports:
      - "20001:20001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "infisical.casa:192.168.1.55"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./servers.json:/app/servers.json:ro
      - /home/felipe/.engram:/root/.engram
      - ./sonarqube-wrapper.cjs:/app/sonarqube-wrapper.cjs:ro
      - ./sonarqube-bootstrap.env:/app/sonarqube-bootstrap.env:ro
      - /home/felipe/.local/bin/codebase-memory-mcp:/usr/local/bin/codebase-memory-mcp:ro
      - /mnt/nas/sources:/mnt/nas/sources
    environment:
      PORT: 20001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
